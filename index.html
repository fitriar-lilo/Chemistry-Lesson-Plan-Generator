<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semesta Cambridge Chemistry Lesson Plan Generator</title>
    <meta name="description" content="Official Semesta School Cambridge IGCSE and AS/A Level Chemistry lesson plan generator featuring 5E model, WALT/WILF/SLO, multi-tier differentiation, LaTeX equations, and clean PDF/DOCX export." />
    <meta property="og:title" content="Semesta Cambridge Chemistry Lesson Plan Generator" />
    <meta property="og:description" content="Official Semesta School Cambridge IGCSE and AS/A Level Chemistry lesson plan generator featuring 5E model, WALT/WILF/SLO, multi-tier differentiation, LaTeX equations, and clean PDF/DOCX export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <!-- MathJax 3 configuration & script (tex-svg with fontCache: 'none') -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        },
        svg: {
          fontCache: 'none'
        },
        options: {
          enableMenu: false
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <!-- html2canvas (v1.4.1) pinned version from cdnjs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- jsPDF (v2.5.1) pinned version from cdnjs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
